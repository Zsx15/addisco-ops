name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: |
          for f in app.py ai_service.py database.py document_service.py ui_helpers.py; do
            if [ -f "$f" ]; then
              python -m py_compile "$f" && echo "OK: $f" || exit 1
            fi
          done

      - name: Run regression tests
        run: python -m unittest test_regression.py -v

      - name: Run integration tests
        run: python -m unittest test_integration.py -v
