name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # Clé fictive — les tests mockent tous les appels LLM, aucun appel réel en CI
  OPENAI_API_KEY: "ci-dummy-key"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python files
        run: |
          find . -name "*.py" \
            -not -path "./.venv/*" \
            -not -path "./__pycache__/*" \
            -not -path "./backups/*" \
            -not -path "./.git/*" \
            -print0 | xargs -0 python -m py_compile
          echo "py_compile OK"

      - name: Run regression tests
        run: python -m unittest test_regression.py -v

      - name: Run integration tests
        run: python -m unittest test_integration.py -v
